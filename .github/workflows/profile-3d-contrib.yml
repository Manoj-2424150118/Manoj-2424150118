# github-profile-3d-contrib (yoshi389111, MIT): renders the contribution
# graph as a 3D "city" of blocks — one tower per day, taller with more
# contributions. Regenerated nightly by the action itself, which commits
# the SVGs under profile-3d-contrib/.
name: Profile 3D Contrib

on:
  schedule:
    # Nightly, after the snake (00:00 UTC) and koi (00:20 UTC) runs.
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-3d-contrib

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the city if it changed
        shell: bash
        run: |
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "The city is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "city: rebuild the 3D contribution city"
          git push --quiet
