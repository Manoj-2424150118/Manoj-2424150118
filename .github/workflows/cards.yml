name: README Cards

# Redraws the animated SVG cards (cards/) from the public contribution
# calendar every morning and commits them if anything changed.
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions and render cards
        run: python scripts/render_readme_cards.py --fetch
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "No card changes today."
          else
            git commit -m "cards: daily redraw from contribution data"
            git push
          fi
